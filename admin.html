<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MSC Book Collection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h1>Admin Dashboard - MSC Book Collection</h1>
    </header>

    <div class="navbar">
        <ul>
            <li><button onclick="logout()" style="background: none; border: none; font-size: 1rem; color: #FF0000; font-weight: bold; cursor: pointer; padding: 10px;">Logout</button></li>
        </ul>
    </div>

    <div class="dashboard-container">
        <h2>Current Borrow & Return Requests</h2>
        <div id="data-container" style="overflow-x: auto; width: 100%;">
            <p>Loading collection data...</p>
        </div>
    </div>

    <div class="dashboard-container admin-book-actions">
        <h2>Book Management</h2>
        <div class="prominent-actions">
            <button id="openAddBookModal" class="action-btn return-btn" style="font-size: 1.1rem; padding: 15px;">Add New Book</button>
            <button id="openDeleteBookModal" class="action-btn delete-button" style="background-color: #dc3545; font-size: 1.1rem; padding: 15px;">Delete Books</button>
            <button id="openUpdateBotmModal" class="action-btn borrow-btn" style="font-size: 1.1rem; padding: 15px;">Update Latest / BotM</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 MSC Book Collection - Admin Area</p>
    </footer>

    <div id="addBookModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal('addBookModal')">&times;</span>
            <h2>Add New Book</h2>
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdpxvArZsHA7UMjbv88oMnif2SPeAAdGlVrvWaEMJL8CDh0-w/viewform?embedded=true" width="100%" height="600" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>
    </div>

    <div id="deleteBookModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal('deleteBookModal')">&times;</span>
            <h2>Delete Books - Instructions</h2>
            <div id="deleteChartContainer" style="overflow-x: auto;">
                <p>Loading collection data...</p>
            </div>
        </div>
    </div>

    <div id="updateBotmModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal('updateBotmModal')">&times;</span>
            <h2>Update Latest Update / BotM</h2>
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdvPbRVvckQ1wdYUAC2tcwTC3imxsuoSCA2SmYl_xiOL5LXaw/viewform?embedded=true" width="100%" height="500" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
