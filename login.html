<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MSC Book Collection Log In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Log In</h2>
    <form id="firebaseLoginForm" class="space-y-4">
      <div>
        <label for="firebaseEmail" class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
        <input type="email" id="firebaseEmail" required class="block w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>

      <div>
        <label for="firebasePassword" class="block text-sm font-medium text-gray-700 mb-1">Password:</label>
        <input type="password" id="firebasePassword" required class="block w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">Log In</button>

      <div id="firebaseError" class="hidden text-red-600 text-sm mt-2"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBOEU6zCbp66le6Dr06GpmGx1yeT5WHNk0",
      authDomain: "msc-library-808-en.firebaseapp.com",
      projectId: "msc-library-808-en",
      storageBucket: "msc-library-808-en.firebasestorage.app",
      messagingSenderId: "62522328857",
      appId: "1:62522328857:web:b56829c3d41238f0866788"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('firebaseLoginForm');
    if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('firebaseEmail').value;
            const password = document.getElementById('firebasePassword').value;
            const errorMsg = document.getElementById('firebaseError');
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    errorMsg.classList.remove('hidden');
                    errorMsg.innerText = error.message;
                });
        });
    }
  </script>
</body>
</html>
