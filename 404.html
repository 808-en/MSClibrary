<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied (0x5)</title>
    <style>
        :root {
            --primary-red: #dc2626;
            --hover-red: #b91c1c;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .icon-container {
            color: var(--primary-red);
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        .error-code-big {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary-red);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -0.05em;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .error-details {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: #f1f5f9;
            color: #334155;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .error-message {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-action {
            display: inline-block;
            background-color: var(--primary-red);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-action:hover {
            background-color: var(--hover-red);
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5" />
                <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6" />
                <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v4.5" />
                <path d="M6 10V8a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v7c0 5.5 4.5 10 10 10h1a10 10 0 0 0 10-10v-1.5a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2V11" />
            </svg>
        </div>

        <div class="error-code-big">ERROR 404</div>
        
        <h1 class="error-title">Error 404</h1>
        
        <div class="error-details">ERROR_RESOURCE_NOT_FOUND</div>
        
        <p class="error-message">
            The page you are looking for does not exist or has been moved. <a href="index.html">Back to Home Page</a>
        </p>

        <a href="chrome://newtab">Fix</a>
    </div>

</body>
</html>
